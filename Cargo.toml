[package]
name = "jetbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[features]
# TLS for the acceptor and initiators, from the sessions file.
tls = ["turbojet/tls", "turbojet-config/tls"]

[dependencies]
# By path while the engine API Jetbridge needs is still changing; crates.io once released.
turbojet = { path = "../turbojet/crates/turbojet" }
# `tz`: named time zones in session schedules and `day_end`.
turbojet-config = { path = "../turbojet/crates/turbojet-config", features = ["tz"] }
turbojet-fix42 = { path = "../turbojet/crates/turbojet-fix42" }
turbojet-fix44 = { path = "../turbojet/crates/turbojet-fix44" }
# Turbojet's clock and schedules speak chrono's times.
chrono = { version = "0.4", default-features = false }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Self-signed certificates for the TLS test, at Turbojet's version.
rcgen = "0.14"
tempfile = "3"
# The end-to-end tests' relay between the gateway and a venue.
tokio = { version = "1", features = ["io-util"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
