[package]
name = "jetbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[features]
# TLS for the acceptor and initiators, from the sessions file, and for the API.
tls = ["turbojet/tls", "turbojet-config/tls", "dep:tokio-rustls"]
# `[message_log] compress`: gzip the message log's finished files.
gzip = ["turbojet/gzip"]

[dependencies]
# The API's password hashes (argon2id, PHC strings): slow on purpose.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
# The API's tokens and session IDs, base64url.
base64ct = { version = "1", features = ["alloc"] }
# Random tokens, session IDs and salts, from the OS.
getrandom = "0.3"
# Reading a new user's password without echoing it.
rpassword = "7"
# The users file keeps tokens' SHA-256, compared in constant time.
sha2 = "0.10"
subtle = "2"
# The users file's atomic rewrite: a temporary file beside it, renamed over it.
tempfile = "3"
# By path while the engine API Jetbridge needs is still changing; crates.io once released.
turbojet = { path = "../turbojet/crates/turbojet" }
# `tz`: named time zones in session schedules and `day_end`.
turbojet-config = { path = "../turbojet/crates/turbojet-config", features = ["tz"] }
turbojet-fix42 = { path = "../turbojet/crates/turbojet-fix42" }
turbojet-fix44 = { path = "../turbojet/crates/turbojet-fix44" }
# The operator API's HTTP server. HTTP/1.1 only: the Origin check on a cookie's websocket upgrade
# (`api::auth`) keys on the Upgrade header, which HTTP/2's extended CONNECT doesn't send.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
# Turbojet's clock and schedules speak chrono's times.
chrono = { version = "0.4", default-features = false, features = ["serde"] }
# Turbojet's string and decimal types, for their serde impls: the API's views hold them.
compact_str = { version = "0.10", default-features = false, features = ["serde"] }
rust_decimal = { version = "1", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The API's TLS streams, as Turbojet's own TLS makes them: the same crate, named.
tokio-rustls = { version = "0.26", default-features = false, optional = true }
# The book's database, as Turbojet's turbojet-sql: `any` so PostgreSQL is a feature away.
sqlx = { version = "0.8.6", default-features = false, features = ["any", "runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["display", "parse", "serde", "std"] }
# The API's limit edits: one table changed, the rest of jetbridge.toml kept as written.
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Self-signed certificates for the TLS test, at Turbojet's version.
rcgen = "0.14"
# Calling the API's router in-process.
tower = { version = "0.5", default-features = false, features = ["util"] }
# A websocket client for the live socket's tests, at axum's version.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false }
# The end-to-end tests' relay between the gateway and a venue.
tokio = { version = "1", features = ["io-util"] }

# Argon2 is slow on purpose, and unoptimised far slower: each test's password check would take
# seconds.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
