[package]
name = "jetbridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
publish = false

[dependencies]
# By path while the engine API Jetbridge needs is still changing; crates.io once released.
turbojet = { path = "../turbojet/crates/turbojet" }
tracing = "0.1"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
too_many_lines = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
